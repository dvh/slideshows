<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 640"
   width="1000"
   height="640"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title>Vergelijking: vrije tekst (niet machine leesbaar) versus HTML met tags en attributen (machine leesbaar) — zelfde feit over de Diefdijk, twee formaten</title>

  <!-- decorative accent dots -->
  <circle cx="960" cy="26" r="7" fill="#007BC7" opacity="0.18" />
  <circle cx="985" cy="46" r="4" fill="#39870C" opacity="0.25" />
  <circle cx="940" cy="50" r="5" fill="#F5C26B" opacity="0.3" />
  <circle cx="995" cy="22" r="3" fill="#154273" opacity="0.2" />

  <!-- ============ LEFT: vrije tekst (niet machine leesbaar) ============ -->
  <rect x="40" y="60" width="430" height="480" rx="20" fill="#ffffff" stroke="#9AA3AD" stroke-width="3" stroke-dasharray="8 7" />

  <!-- top badge -->
  <rect x="160" y="46" width="190" height="28" rx="14" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.5" />
  <text x="255" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3" fill="#B3261E">NIET MACHINE LEESBAAR</text>

  <!-- icon -->
  <circle cx="100" cy="130" r="26" fill="#F1F0EE" />
  <g stroke="#6B7785" stroke-width="3" stroke-linecap="round">
    <line x1="88" y1="118" x2="112" y2="118" />
    <line x1="85" y1="130" x2="115" y2="130" />
    <line x1="90" y1="142" x2="110" y2="142" />
  </g>
  <text x="145" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#154273">Vrije tekst</text>
  <text x="145" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7785">leesbaar voor mensen, niet voor code</text>

  <!-- "paper" body -->
  <rect x="64" y="170" width="382" height="280" rx="12" fill="#FBFBFA" stroke="#E4E7EA" stroke-width="1" />
  <g font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#33393F">
    <text x="84" y="202">De Diefdijk is een dijk. Dit is een</text>
    <text x="84" y="228">kunstmatige waterkering uit informatie-</text>
    <text x="84" y="254">model IMWA. De dijk beschermt het</text>
    <text x="84" y="280">achterland tegen hoog water en staat</text>
    <text x="84" y="306">sinds de laatste inspectie geregistreerd</text>
    <text x="84" y="332">als "in orde".</text>
  </g>

  <!-- annotation -->
  <text x="64" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B3261E">Machine moet raden: is "Diefdijk" de naam of het type?</text>
  <text x="64" y="502" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7785">Alleen via taalanalyse (NLP) of handmatig uitzoeken.</text>

  <!-- ============ RIGHT: HTML met microdata (machine leesbaar) ============ -->
  <rect x="530" y="60" width="430" height="480" rx="20" fill="#ffffff" stroke="#007BC7" stroke-width="3" />

  <!-- top badge -->
  <rect x="650" y="46" width="190" height="28" rx="14" fill="#EAF6E4" stroke="#39870C" stroke-width="1.5" />
  <text x="745" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3" fill="#39870C">MACHINE LEESBAAR</text>

  <!-- icon -->
  <circle cx="590" cy="130" r="26" fill="#DCEFFB" />
  <text x="590" y="137" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#007BC7">&lt;/&gt;</text>
  <text x="635" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#154273">HTML</text>
  <text x="635" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7785">structuur (tags &amp; attributen) — machine leesbaar</text>

  <!-- code body -->
  <rect x="554" y="170" width="382" height="280" rx="12" fill="#0F2A44" />
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve">
    <text x="574" y="200" fill="#8ED1FA">&lt;table&gt;</text>
    <text x="598" y="232"><tspan fill="#8ED1FA">&lt;th </tspan><tspan fill="#F5C26B">scope</tspan><tspan fill="#E4EAF0">=</tspan><tspan fill="#9BE38A">"col"</tspan><tspan fill="#8ED1FA">&gt;</tspan><tspan fill="#E4EAF0">Naam</tspan><tspan fill="#8ED1FA">&lt;/th&gt;</tspan></text>
    <text x="598" y="264"><tspan fill="#8ED1FA">&lt;th </tspan><tspan fill="#F5C26B">scope</tspan><tspan fill="#E4EAF0">=</tspan><tspan fill="#9BE38A">"col"</tspan><tspan fill="#8ED1FA">&gt;</tspan><tspan fill="#E4EAF0">Type</tspan><tspan fill="#8ED1FA">&lt;/th&gt;</tspan></text>
    <text x="598" y="296"><tspan fill="#8ED1FA">&lt;td&gt;</tspan><tspan fill="#E4EAF0">Diefdijk</tspan><tspan fill="#8ED1FA">&lt;/td&gt;</tspan></text>
    <text x="598" y="328"><tspan fill="#8ED1FA">&lt;td&gt;</tspan><tspan fill="#E4EAF0">Dijk</tspan><tspan fill="#8ED1FA">&lt;/td&gt;</tspan></text>
    <text x="574" y="360" fill="#8ED1FA">&lt;/table&gt;</text>
  </g>

  <!-- annotation -->
  <text x="554" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#39870C">th scope="col" koppelt koptekst aan kolom.</text>
  <text x="554" y="502" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7785">Positie bepaalt het veld — geen taalanalyse nodig.</text>

  <!-- shared caption -->
  <text x="500" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#154273">Zelfde feit, twee formaten</text>
  <text x="500" y="616" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6B7785">Betekenis in tags &amp; attributen — niet in zinsopbouw</text>
</svg>
