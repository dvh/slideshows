<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0a5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#017bc6"/>
    </marker>
  </defs>

  <!-- ===== Bronhouder ===== -->
  <rect x="30" y="20" width="170" height="340" rx="12" fill="#f0faf4" stroke="#0a5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="115" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#0a5" font-weight="600">Bronhouder</text>

  <rect x="40" y="120" width="150" height="60" rx="10" fill="#0a5" filter="url(#shadow)"/>
  <text x="115" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="600">Beschikking 2027</text>
  <text x="115" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce9d9">peiljaar 2027 · €350k</text>

  <rect x="40" y="190" width="150" height="60" rx="10" fill="#0a5" filter="url(#shadow)"/>
  <text x="115" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="600">Waardewijziging</text>
  <text x="115" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce9d9">jul-dec 2026 · €330k</text>

  <rect x="40" y="260" width="150" height="60" rx="10" fill="#0a5" filter="url(#shadow)"/>
  <text x="115" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="600">Beschikking 2026</text>
  <text x="115" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce9d9">peiljaar 2026 · €300k</text>

  <!-- Dikke "fat arrow" polygonen voor Bronhouder → LV -->
  <polygon points="203,144 211,144 211,135 220,150 211,165 211,156 203,156" fill="#0a5" filter="url(#shadow)"/>
  <polygon points="203,214 211,214 211,205 220,220 211,235 211,226 203,226" fill="#0a5" filter="url(#shadow)"/>
  <polygon points="203,284 211,284 211,275 220,290 211,305 211,296 203,296" fill="#0a5" filter="url(#shadow)"/>

  <!-- ===== LV-WOZ (bevat Leveringenstapel én Projecties) ===== -->
  <rect x="225" y="20" width="450" height="340" rx="12" fill="#e8f4fc" stroke="#017bc6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#017bc6" font-weight="600">LV-WOZ</text>

  <!-- Subtle internal divider -->
  <line x1="462" y1="70" x2="462" y2="350" stroke="#017bc6" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.45"/>

  <!-- Sub-headers -->
  <text x="340" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#017bc6" font-style="italic">Leveringenstapel · nieuwste boven ↑</text>
  <text x="567" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" font-style="italic">Projecties</text>

  <!-- Leveringen -->
  <rect x="235" y="120" width="215" height="60" rx="6" fill="#017bc6" filter="url(#shadow)"/>
  <text x="342" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" font-weight="600">Levering 3 · t = 2027-02-15</text>
  <text x="342" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce7f4">Beschikking 2027 · €350k</text>

  <rect x="235" y="190" width="215" height="60" rx="6" fill="#017bc6" filter="url(#shadow)"/>
  <text x="342" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" font-weight="600">Levering 2 · t = 2026-09-10</text>
  <text x="342" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce7f4">Tussentijdse wijziging · €330k</text>

  <rect x="235" y="260" width="215" height="60" rx="6" fill="#017bc6" filter="url(#shadow)"/>
  <text x="342" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" font-weight="600">Levering 1 · t = 2026-04-15</text>
  <text x="342" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cce7f4">Beschikking 2026 · €300k</text>

  <!-- Projecties -->
  <rect x="475" y="120" width="190" height="60" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d97706" font-weight="600">Waarde op peildatum</text>
  <text x="570" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" font-style="italic">peildatum-query</text>

  <rect x="475" y="190" width="190" height="60" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d97706" font-weight="600">Wijzigingen sinds T</text>
  <text x="570" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" font-style="italic">delta-query</text>

  <rect x="475" y="260" width="190" height="60" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d97706" font-weight="600">Snapshot bij T_t</text>
  <text x="570" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" font-style="italic">snapshot-query</text>

  <!-- Dikke "fat arrow" polygonen voor LV → Afnemers -->
  <polygon points="678,144 686,144 686,135 695,150 686,165 686,156 678,156" fill="#7c83bc" filter="url(#shadow)"/>
  <polygon points="678,214 686,214 686,205 695,220 686,235 686,226 678,226" fill="#7c83bc" filter="url(#shadow)"/>
  <polygon points="678,284 686,284 686,275 695,290 686,305 686,296 678,296" fill="#7c83bc" filter="url(#shadow)"/>

  <!-- ===== Afnemers (smaller width, gecentreerd op x=785) ===== -->
  <rect x="700" y="20" width="170" height="340" rx="12" fill="#eef2ff" stroke="#7c83bc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7c83bc" font-weight="600">Afnemers</text>

  <!-- Belastingdienst met 2 tags -->
  <rect x="710" y="120" width="150" height="60" rx="10" fill="#7c83bc" filter="url(#shadow)"/>
  <text x="785" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Belastingdienst</text>
  <rect x="730" y="155" width="62" height="17" rx="8.5" fill="white" stroke="#d97706" stroke-width="1.2"/>
  <text x="761" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706" font-weight="600">peildatum</text>
  <rect x="798" y="155" width="42" height="17" rx="8.5" fill="white" stroke="#d97706" stroke-width="1.2"/>
  <text x="819" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706" font-weight="600">delta</text>

  <!-- Waterschap met 1 tag -->
  <rect x="710" y="190" width="150" height="60" rx="10" fill="#7c83bc" filter="url(#shadow)"/>
  <text x="785" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Waterschap</text>
  <rect x="754" y="225" width="62" height="17" rx="8.5" fill="white" stroke="#d97706" stroke-width="1.2"/>
  <text x="785" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706" font-weight="600">peildatum</text>

  <!-- CBS met 1 tag -->
  <rect x="710" y="260" width="150" height="60" rx="10" fill="#7c83bc" filter="url(#shadow)"/>
  <text x="785" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">CBS</text>
  <rect x="757" y="295" width="56" height="17" rx="8.5" fill="white" stroke="#d97706" stroke-width="1.2"/>
  <text x="785" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706" font-weight="600">snapshot</text>

  <!-- Bottom captions -->
  <text x="115" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Levert gebeurtenissen</text>
  <text x="450" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Stapelt en projecteert</text>
  <text x="785" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Kiezen projecties per proces</text>
</svg>
