<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c60"/>
    </marker>
  </defs>

  <!-- Y-axis label (rotated) -->
  <text x="36" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#017bc6" font-weight="600" transform="rotate(-90, 36, 185)">Transactietijd · LV-formeel</text>

  <!-- Geen kennis bij LV (peiljaar 2026, before L1 intro) -->
  <rect x="175" y="295" width="250" height="35" fill="#f5f5f5"/>

  <!-- Geen kennis bij LV (peiljaar 2027, before L3 intro) -->
  <rect x="425" y="155" width="250" height="175" fill="#f5f5f5"/>

  <!-- Y-axis (arrow points up toward heden) -->
  <line x1="140" y1="330" x2="140" y2="40" stroke="#555" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- X-axis -->
  <line x1="140" y1="330" x2="740" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <text x="550" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#999" font-style="italic">geen kennis bij LV</text>

  <!-- L1 as one L-shaped polygon (jan-jun full height, jul-dec only below y=230) -->
  <polygon points="175,40 300,40 300,230 425,230 425,295 175,295" fill="#cce7f4" stroke="#017bc6" stroke-width="0.5" filter="url(#shadow)"/>

  <!-- L1 main label (in left column) -->
  <text x="237" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#015e9b" font-weight="600">L1</text>
  <text x="237" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#015e9b">Beschikking 2026</text>
  <text x="237" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#015e9b">€300.000</text>

  <!-- L1 partial label (in jul-dec lower block) -->
  <text x="362" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#015e9b" font-weight="600">L1</text>
  <text x="362" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#015e9b" font-style="italic">(zelfde levering)</text>

  <!-- L2: VT jul-dec 2026, supersedes L1 for that range above y=230 -->
  <rect x="300" y="40" width="125" height="190" fill="#80b9e0" stroke="#017bc6" stroke-width="0.5" filter="url(#shadow)"/>
  <text x="362" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">L2</text>
  <text x="362" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">Tussentijdse</text>
  <text x="362" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">waardewijziging</text>
  <text x="362" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">€330.000</text>

  <!-- L3: VT 2027 -->
  <rect x="425" y="40" width="250" height="115" fill="#017bc6" stroke="#017bc6" stroke-width="0.5" filter="url(#shadow)"/>
  <text x="550" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">L3 · Beschikking 2027</text>
  <text x="550" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">€350.000</text>

  <!-- Y-axis ticks and labels -->
  <line x1="136" y1="295" x2="144" y2="295" stroke="#555" stroke-width="1"/>
  <text x="132" y="299" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#555">2026-04-15</text>

  <line x1="136" y1="230" x2="144" y2="230" stroke="#555" stroke-width="1"/>
  <text x="132" y="234" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#555">2026-09-10</text>

  <line x1="136" y1="155" x2="144" y2="155" stroke="#555" stroke-width="1"/>
  <text x="132" y="159" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#555">2027-02-15</text>

  <text x="132" y="46" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#555" font-style="italic">heden</text>

  <!-- X-axis ticks and labels -->
  <line x1="175" y1="326" x2="175" y2="334" stroke="#555" stroke-width="1"/>
  <text x="175" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#555">2026-01-01</text>

  <line x1="300" y1="326" x2="300" y2="334" stroke="#555" stroke-width="1"/>
  <text x="300" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#555">2026-07-01</text>

  <line x1="425" y1="326" x2="425" y2="334" stroke="#555" stroke-width="1"/>
  <text x="425" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#555">2027-01-01</text>

  <line x1="675" y1="326" x2="675" y2="334" stroke="#555" stroke-width="1"/>
  <text x="675" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#555">2027-12-31</text>

  <!-- Query crosshairs at (T_g = 2026-09-15, T_t = 2026-11-15) -->
  <!-- 2026-09-15: x ≈ 355 (in jul-dec section, ~40% in) -->
  <!-- 2026-11-15: y ≈ 200 (in L2 region, below L2 label) -->
  <line x1="140" y1="200" x2="355" y2="200" stroke="#c60" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="355" y1="330" x2="355" y2="200" stroke="#c60" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Query point -->
  <circle cx="355" cy="200" r="6" fill="#c60" stroke="white" stroke-width="2"/>

  <!-- Query annotation arrow -->
  <line x1="745" y1="200" x2="365" y2="200" stroke="#c60" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arrowOrange)"/>

  <!-- Legend / query annotation panel -->
  <rect x="755" y="123" width="135" height="155" rx="6" fill="white" stroke="#c60" stroke-width="1"/>
  <text x="822" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c60" font-weight="600">projectie</text>
  <line x1="765" y1="153" x2="880" y2="153" stroke="#c60" stroke-width="0.5"/>

  <text x="765" y="173" font-family="system-ui, sans-serif" font-size="10" fill="#555">T<tspan font-size="8" dy="3">t</tspan><tspan dy="-3"> = 2026-11-15</tspan></text>
  <text x="765" y="189" font-family="system-ui, sans-serif" font-size="9" fill="#888">(transactietijd)</text>

  <text x="765" y="211" font-family="system-ui, sans-serif" font-size="10" fill="#555">T<tspan font-size="8" dy="3">g</tspan><tspan dy="-3"> = 2026-09-15</tspan></text>
  <text x="765" y="227" font-family="system-ui, sans-serif" font-size="9" fill="#888">(peildatum)</text>

  <line x1="765" y1="239" x2="880" y2="239" stroke="#c60" stroke-width="0.5"/>
  <text x="822" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#555" font-weight="600">→ L2 · €330.000</text>
  <text x="822" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#888">(na waardewijziging)</text>

</svg>
