<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 52 1025 406" width="1025" height="406" font-family="Helvetica, Arial, sans-serif">
  <!-- grid background -->
  <rect x="235" y="65" width="885" height="320" fill="#f7fbfe"/>
  <!-- highlighted Saturday row (the query's valid time) -->
  <rect x="235" y="145" width="885" height="80" fill="#e3f1fb"/>

  <!-- grid lines -->
  <line x1="530" y1="65" x2="530" y2="385" stroke="#9cc6e8" stroke-width="1.2"/>
  <line x1="825" y1="65" x2="825" y2="385" stroke="#9cc6e8" stroke-width="1.2"/>
  <line x1="235" y1="145" x2="1120" y2="145" stroke="#9cc6e8" stroke-width="1.2"/>
  <line x1="235" y1="225" x2="1120" y2="225" stroke="#9cc6e8" stroke-width="1.2"/>
  <line x1="235" y1="305" x2="1120" y2="305" stroke="#9cc6e8" stroke-width="1.2"/>
  <rect x="235" y="65" width="885" height="320" fill="none" stroke="#017bc6" stroke-width="2"/>

  <!-- forecast value in each box (a future day, as forecast at each recording) -->
  <text x="382" y="113" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">20°C</text>
  <text x="677" y="113" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">22°C</text>
  <text x="972" y="113" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">21°C</text>

  <text x="382" y="193" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">16°C</text>
  <text x="677" y="193" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">18°C</text>
  <text x="972" y="193" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">24°C</text>

  <text x="382" y="273" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">19°C</text>
  <text x="677" y="273" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">21°C</text>
  <text x="972" y="273" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">22°C</text>

  <text x="382" y="353" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">17°C</text>
  <text x="677" y="353" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">18°C</text>
  <text x="972" y="353" font-size="23" font-weight="700" fill="#0a4f7a" text-anchor="middle">20°C</text>

  <!-- a query: one point (validAt = Sat, recordedAt = now), crosshair to both axes -->
  <line x1="235" y1="185" x2="1075" y2="185" stroke="#017bc6" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.45"/>
  <line x1="1075" y1="185" x2="1075" y2="385" stroke="#017bc6" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.45"/>
  <text x="1075" y="166" font-size="15" font-weight="700" fill="#017bc6" text-anchor="middle">a query</text>
  <circle cx="1075" cy="185" r="10" fill="#017bc6" stroke="#ffffff" stroke-width="2"/>

  <!-- y-axis: valid time = which upcoming day the forecast is for -->
  <text transform="translate(155,225) rotate(-90)" font-size="21" font-weight="700" fill="#017bc6" text-anchor="middle">valid time</text>
  <text x="218" y="111" font-size="19" fill="#555555" text-anchor="end">Sun</text>
  <text x="218" y="191" font-size="19" fill="#555555" text-anchor="end">Sat</text>
  <text x="218" y="271" font-size="19" fill="#555555" text-anchor="end">Fri</text>
  <text x="218" y="351" font-size="19" fill="#555555" text-anchor="end">Thu</text>

  <!-- x-axis: transaction time = the day each forecast was recorded; one label centered per column -->
  <text x="382" y="410" font-size="19" fill="#555555" text-anchor="middle">Mon</text>
  <text x="677" y="410" font-size="19" fill="#555555" text-anchor="middle">Tue</text>
  <text x="972" y="410" font-size="19" fill="#555555" text-anchor="middle">Wed</text>
  <text x="1075" y="410" font-size="19" font-weight="700" fill="#017bc6" text-anchor="middle">now</text>
  <text x="677" y="442" font-size="21" font-weight="700" fill="#017bc6" text-anchor="middle">transaction time</text>
</svg>
